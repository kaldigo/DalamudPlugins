name: Refresh opt-in testing feed
on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [testing]
    paths: [testing-sources.json, tools/compose_testing_feed.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: testing-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/compose_testing_feed.py
      - name: Commit testing feed only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing-pluginmaster.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh opt-in testing feed from current stable sources'
            git push origin HEAD:testing
          fi
