# Compatibility refresh for users who briefly added the old testing URL.
# Both URLs now serve the main feed; all channel composition happens in sync_feed.py.
name: Refresh legacy testing feed alias
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: testing-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - name: Mirror the main feed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://raw.githubusercontent.com/kaldigo/DalamudPlugins/main/pluginmaster.json -o testing-pluginmaster.json
          python -c "import json; assert isinstance(json.load(open('testing-pluginmaster.json')), list)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing-pluginmaster.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mirror main feed for legacy testing URL'
            git push origin HEAD:testing
          fi
